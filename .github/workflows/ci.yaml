name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Lint"
    if: ${{ !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-go

      - uses: ./.github/actions/go-lint

      - uses: ./.github/actions/go-security
        with:
          trufflehog-base: "${{ github.event.pull_request.base.sha || github.event.before }}"
          trufflehog-head: "${{ github.event.pull_request.head.sha || github.sha }}"
